<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael Jackson 3D VR Dance Room</title>
    <!-- A-Frame WebVR Library -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(10, 10, 26, 0.85);
            padding: 15px 22px;
            border-radius: 12px;
            z-index: 100;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            border: 1px solid #00ffff;
            backdrop-filter: blur(5px);
        }
        #instructions h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #00ffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
        }
        #instructions p {
            margin: 5px 0;
            font-size: 14px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="instructions">
        <h2>🕺 VR Dance Room Controls</h2>
        <p>🎮 <b>การควบคุม:</b> ปุ่ม <b>W, A, S, D</b> หรือ <b>ปุ่มลูกศร (Arrow Keys)</b></p>
        <p>👀 <b>มุมมอง:</b> คลิกเมาส์ค้างแล้วลาก (Mouse Drag)</p>
    </div>

    <a-scene background="color: #050510">
        <!-- Asset Management -->
        <a-assets>
            <img id="grid" src="https://cdn.aframe.io/a-painter/images/floor.png">
        </a-assets>

        <!-- Player Camera with WASD + Arrow controls -->
        <a-entity id="rig" position="0 1.6 4" movement-controls="fly: false; speed: 0.2">
            <a-entity camera look-controls wasd-controls="fly: false; acceleration: 40"></a-entity>
        </a-entity>

        <!-- Lighting -->
        <a-light type="ambient" color="#333355" intensity="0.8"></a-light>
        <a-light type="spot" color="#00ffff" position="0 6 0" intensity="2" angle="45" target="#mj-stage"></a-light>
        <a-light type="point" color="#ff007f" position="-3 3 -2" intensity="1.5"></a-light>
        <a-light type="point" color="#00ffcc" position="3 3 -2" intensity="1.5"></a-light>

        <!-- Floor -->
        <a-plane position="0 0 -2" rotation="-90 0 0" width="14" height="14" color="#111122" material="src: #grid; repeat: 10 10; roughness: 0.2; metalness: 0.8;"></a-plane>

        <!-- Room Walls -->
        <a-box position="0 3.5 -9" width="14" height="7" depth="0.1" color="#0a0a1a"></a-box>
        <a-box position="-7 3.5 -2" rotation="0 90 0" width="14" height="7" depth="0.1" color="#0a0a1a"></a-box>
        <a-box position="7 3.5 -2" rotation="0 -90 0" width="14" height="7" depth="0.1" color="#0a0a1a"></a-box>

        <!-- Neon Deco Lights -->
        <a-cylinder position="-3.5 0.05 -2" radius="1.8" height="0.1" color="#ff00aa" material="emissive: #ff00aa; emissiveIntensity: 0.5"></a-cylinder>
        <a-cylinder position="3.5 0.05 -2" radius="1.8" height="0.1" color="#00ffff" material="emissive: #00ffff; emissiveIntensity: 0.5"></a-cylinder>

        <!-- Center Stage -->
        <a-cylinder id="mj-stage" position="0 0.1 -2" radius="2.5" height="0.2" color="#1a1a2e" material="roughness: 0.1">
            <a-torus position="0 0.1 0" rotation="90 0 0" radius="2.5" radius-tubular="0.03" color="#00ffff" material="emissive: #00ffff; emissiveIntensity: 1"></a-torus>
        </a-cylinder>

        <!-- Michael Jackson Character -->
        <a-entity id="mj-character" position="0 0.2 -2">
            <!-- Fedora Hat -->
            <a-cone position="0 1.9 0" radius-bottom="0.25" radius-top="0.1" height="0.15" color="#111111"></a-cone>
            <a-cylinder position="0 1.83 0" radius="0.38" height="0.02" color="#111111"></a-cylinder>
            
            <!-- Head & Sunglasses -->
            <a-sphere position="0 1.7 0" radius="0.16" color="#ffdbac"></a-sphere>
            <a-box position="0 1.72 0.12" width="0.2" height="0.06" depth="0.05" color="#000000"></a-box>

            <!-- Jacket & Sequins Shirt -->
            <a-box position="0 1.3 0" width="0.45" height="0.55" depth="0.25" color="#111111"></a-box>
            <a-box position="0 1.3 0.01" width="0.2" height="0.5" depth="0.25" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 0.3"></a-box>

            <!-- White Glove (Iconic MJ Glove) -->
            <a-sphere position="-0.3 1.3 0.1" radius="0.07" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 0.8">
                <a-animation attribute="material.emissiveIntensity" from="0.3" to="1" dir="alternate" dur="500" repeat="indefinite"></a-animation>
            </a-sphere>

            <!-- Pants & Black Shoes with White Socks -->
            <a-cylinder position="-0.12 0.65 0" radius="0.08" height="0.6" color="#111111"></a-cylinder>
            <a-cylinder position="0.12 0.65 0" radius="0.08" height="0.6" color="#111111"></a-cylinder>
            <a-cylinder position="-0.12 0.25 0" radius="0.07" height="0.15" color="#ffffff"></a-cylinder>
            <a-cylinder position="0.12 0.25 0" radius="0.07" height="0.15" color="#ffffff"></a-cylinder>
            <a-box position="-0.12 0.15 0.05" width="0.12" height="0.08" depth="0.22" color="#000000"></a-box>
            <a-box position="0.12 0.15 0.05" width="0.12" height="0.08" depth="0.22" color="#000000"></a-box>

            <!-- Dance Animation -->
            <a-animation attribute="position" to="0 0.2 -3.5" direction="alternate" dur="2500" repeat="indefinite" easing="linear"></a-animation>
            <a-animation attribute="rotation" to="0 360 0" dur="5000" repeat="indefinite" easing="linear"></a-animation>
        </a-entity>

        <!-- Pulse Ring Floor Effect -->
        <a-entity position="0 0.15 -2">
            <a-ring color="#00ffff" radius-inner="0.1" radius-outer="2.8" rotation="-90 0 0">
                <a-animation attribute="scale" to="1.15 1.15 1.15" dir="alternate" dur="600" repeat="indefinite"></a-animation>
            </a-ring>
        </a-entity>
    </a-scene>

</body>
</html>
